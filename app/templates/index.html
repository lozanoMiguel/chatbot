<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente de Cafe ☕</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        position: relative;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        min-height: 100vh;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      /* Contenedor principal */
      .chat-container {
        width: 100%;
        max-width: 800px;
        height: 90vh;
        max-height: 800px;
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e0e0e0;
        position: relative;
        z-index: 1;
      }

      /* Marca de agua dentro del chat (logo centrado) */
      .chat-container::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        background-image: url("/static/logo.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.06;
        pointer-events: none;
        z-index: 0;
      }

      /* Logos externos (esquinas) */
      .logo-top-left {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 200px;
        height: 200px;
        z-index: 10;
        opacity: 0.2;
        pointer-events: none;
      }

      .logo-bottom-right {
        position: fixed;
        bottom: 16px;
        right: 16px;
        width: 200px;
        height: 200px;
        z-index: 10;
        opacity: 0.15;
        pointer-events: none;
      }

      /* Header */
      .chat-header {
        background: #000000;
        color: white;
        padding: 16px 20px;
        text-align: center;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
      }

      .chat-header h1 {
        font-size: 1.3em;
        margin-bottom: 4px;
        font-weight: 600;
      }

      .chat-header p {
        font-size: 0.75em;
        opacity: 0.7;
      }

      /* Área de mensajes (con scroll) */
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f8f8f8;
        position: relative;
        z-index: 1;
      }

      /* Scrollbar personalizada */
      .chat-messages::-webkit-scrollbar {
        width: 5px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: #e0e0e0;
        border-radius: 3px;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
      }

      /* Mensajes */
      .message {
        margin-bottom: 16px;
        display: flex;
        align-items: flex-start;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 10px 16px;
        border-radius: 20px;
        position: relative;
        line-height: 1.45;
        font-size: 0.95em;
        word-wrap: break-word;
      }

      /* Mensajes del usuario */
      .user .message-content {
        background: #000000;
        color: #ffffff;
        border-bottom-right-radius: 4px;
        border: 1px solid #333;
      }

      /* Mensajes del bot */
      .assistant .message-content {
        background: #ffffff;
        color: #1a1a1a;
        border: 1px solid #d0d0d0;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      /* Listas en mensajes del bot */
      .assistant .message-content ul,
      .assistant .message-content ol {
        margin: 6px 0 6px 18px;
      }

      .assistant .message-content li {
        margin: 3px 0;
      }

      .assistant .message-content p {
        margin: 6px 0;
      }

      .assistant .message-content br {
        display: block;
        margin: 6px 0;
        content: "";
      }

      /* Indicador de escritura */
      .typing-indicator {
        display: none;
        padding: 10px 16px;
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid #d0d0d0;
        width: fit-content;
        border-bottom-left-radius: 4px;
      }

      .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        margin: 0 2px;
        animation: typing 1.4s infinite;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        30% {
          transform: translateY(-8px);
          opacity: 1;
        }
      }

      /* Input container */
      .chat-input-container {
        padding: 12px 16px;
        background: #ffffff;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 10px;
        flex-shrink: 0;
      }

      /* Campo de entrada */
      .chat-input {
        flex: 1;
        padding: 12px 18px;
        border: 1.5px solid #d0d0d0;
        border-radius: 30px;
        font-size: 0.95em;
        outline: none;
        transition: all 0.3s ease;
        font-family: inherit;
        background: #ffffff;
        color: #1a1a1a;
      }

      .chat-input:focus {
        border-color: #000000;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
      }

      .chat-input::placeholder {
        color: #aaa;
        font-weight: 400;
      }

      /* Botón enviar */
      .send-button {
        padding: 12px 24px;
        background: #000000;
        color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: inherit;
        white-space: nowrap;
      }

      .send-button:hover {
        background: #cc0000;
        transform: scale(0.97);
      }

      .send-button:disabled {
        background: #999999;
        cursor: not-allowed;
        transform: none;
      }

      /* ========== MEDIA QUERIES (RESPONSIVE) ========== */

      /* Tablets y móviles grandes (≤ 768px) */
      @media (max-width: 768px) {
        body {
          padding: 12px;
        }

        .chat-container {
          height: 95vh;
          border-radius: 20px;
        }

        .chat-header {
          padding: 12px 16px;
        }

        .chat-header h1 {
          font-size: 1.1em;
        }

        .chat-header p {
          font-size: 0.7em;
        }

        .chat-messages {
          padding: 12px;
        }

        .message-content {
          max-width: 85%;
          font-size: 0.9em;
          padding: 8px 14px;
        }

        .logo-top-left {
          width: 40px;
          height: 40px;
          top: 10px;
          left: 10px;
          opacity: 0.15;
        }

        .logo-bottom-right {
          width: 50px;
          height: 50px;
          bottom: 10px;
          right: 10px;
        }

        .chat-container::before {
          width: 150px;
          height: 150px;
        }

        .send-button {
          padding: 10px 18px;
          font-size: 0.85em;
        }

        .chat-input {
          padding: 10px 16px;
          font-size: 0.9em;
        }
      }

      /* Móviles pequeños (≤ 480px) */
      @media (max-width: 480px) {
        .chat-container {
          height: 98vh;
          border-radius: 16px;
        }

        .chat-header {
          padding: 10px 12px;
        }

        .chat-header h1 {
          font-size: 1em;
        }

        .chat-header p {
          font-size: 0.65em;
        }

        .chat-messages {
          padding: 10px;
        }

        .message-content {
          max-width: 90%;
          font-size: 0.85em;
          padding: 8px 12px;
        }

        .chat-input-container {
          padding: 10px 12px;
          gap: 8px;
        }

        .chat-input {
          padding: 10px 14px;
          font-size: 0.85em;
        }

        .send-button {
          padding: 10px 16px;
          font-size: 0.85em;
        }

        .logo-top-left {
          width: 30px;
          height: 30px;
          top: 8px;
          left: 8px;
        }

        .logo-bottom-right {
          width: 40px;
          height: 40px;
          bottom: 8px;
          right: 8px;
        }

        .chat-container::before {
          width: 120px;
          height: 120px;
        }
      }

      /* Ajustes para landscape (horizontal) en móviles */
      @media (max-width: 768px) and (orientation: landscape) {
        .chat-container {
          height: 92vh;
        }

        .chat-header {
          padding: 8px 16px;
        }

        .chat-header h1 {
          font-size: 0.9em;
        }

        .chat-header p {
          display: none;
        }

        .chat-messages {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Logo en esquina superior izquierda -->
    <!--<img src="/static/logo.png" alt="Logo" class="logo-top-left" />-->

    <div class="chat-container">
      <div class="chat-header">
        <h1>Asistente de Cafe ☕</h1>
        <p>Estoy aqui para ayudarte con la eleccion de tu Cafe</p>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
          <div class="message-content">
            ¡Hola! 👋 Te ayudo a encontrar un café que encaje contigo. ¿Lo
            buscas para espresso o filtro?
          </div>
        </div>
      </div>
      <div class="chat-input-container">
        <input
          type="text"
          class="chat-input"
          id="messageInput"
          placeholder="Escribe tu pregunta sobre café..."
          onkeypress="handleKeyPress(event)"
        />
        <button class="send-button" id="sendButton" onclick="sendMessage()">
          Enviar
        </button>
      </div>
    </div>

    <!-- Logo en esquina inferior derecha (semitransparente como marca de agua) -->
    <!--<img src="/static/logo.png" alt="Logo" class="logo-bottom-right" />-->
    <script>
      const chatMessages = document.getElementById("chatMessages");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");

      let sessionId = localStorage.getItem("chat_session_id");
      if (!sessionId) {
        sessionId = "session_" + Date.now() + "_" + Math.random().toString(36);
        localStorage.setItem("chat_session_id", sessionId);
      }

      function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
      }

      function addMessage(content, isUser) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${isUser ? "user" : "assistant"}`;
        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";

        // 📌 Solo convertir si hay dobles asteriscos
        let formattedContent = content;

        // Si el contenido tiene **texto**, convertirlo a <strong>
        if (formattedContent.includes("**")) {
          formattedContent = formattedContent.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>",
          );
        }

        // Reemplazar saltos de línea por <br>
        formattedContent = formattedContent.replace(/\n/g, "<br>");

        contentDiv.innerHTML = formattedContent;
        messageDiv.appendChild(contentDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function showTypingIndicator() {
        const typingDiv = document.createElement("div");
        typingDiv.className = "message assistant";
        typingDiv.id = "typingIndicator";
        const indicatorDiv = document.createElement("div");
        indicatorDiv.className = "typing-indicator";
        indicatorDiv.innerHTML = "<span></span><span></span><span></span>";
        indicatorDiv.style.display = "block";
        typingDiv.appendChild(indicatorDiv);
        chatMessages.appendChild(typingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();
      }

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;
        messageInput.disabled = true;
        sendButton.disabled = true;
        addMessage(message, true);
        messageInput.value = "";
        showTypingIndicator();
        try {
          const response = await fetch("/preguntar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mensaje: message,
              session_id: sessionId,
            }),
          });
          removeTypingIndicator();
          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.detail || "Error en el servidor");
          }
          const data = await response.json();
          addMessage(data.respuesta, false);
        } catch (error) {
          removeTypingIndicator();
          addMessage(`❌ Error: ${error.message}`, false);
          console.error("Error:", error);
        } finally {
          messageInput.disabled = false;
          sendButton.disabled = false;
          messageInput.focus();
        }
      }
    </script>
  </body>
</html>
